[package]
name = "cuckoo"
version = "0.2.1"
edition = "2021"
autobins = false

[lib]
name = "cuckoo_nest"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py38", "extension-module"] }
rand = "0.8.5"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64"] }
