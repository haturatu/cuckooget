[package]
name = "cuckoo"
version = "0.2.1"
edition = "2021"
autobins = false

[lib]
name = "cuckoo_nest"
crate-type = ["cdylib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
rand = "0.10.3"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64"] }
