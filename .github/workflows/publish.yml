name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: Detect affected files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'src/**'
              - 'lib/**'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'install.sh'
              - 'Makefile'
              - '.python-version'
              - '.github/workflows/publish.yml'
  test:
    needs: changes
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        python-version: ["3.9", "3.15.1"]
    # Python 3.9 has prebuilt interpreters on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package
        run: python -m pip install .

      - name: Smoke test CLI and extension module
        run: |
          ck -h
          python -c "import cuckooget; import cuckooget.cuckoo_nest"

  build:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    needs: [changes, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15.1"
          cache: pip

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${TAG_VERSION#v}" = "$PACKAGE_VERSION" || {
            echo "Tag ${TAG_VERSION} does not match package version ${PACKAGE_VERSION}"
            exit 1
          }

      - name: Build distributions
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Test wheel on Python 3.15
        run: |
          python -m pip install dist/*.whl
          ck -h
          python -c "import cuckooget; import cuckooget.cuckoo_nest"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
